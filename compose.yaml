services:
  app:
    build: .
    ports: ["3000:3000"]
    volumes:
      - .:/app                 # your Mac folder, live-mounted
      - node_modules:/app/node_modules   # keep Linux deps inside the container
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"   # reliable hot reload on Mac mounts
    depends_on: [db]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  node_modules:
  pgdata: